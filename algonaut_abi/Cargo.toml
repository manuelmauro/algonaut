[package]
authors = ["Manuel Mauro <manuel.mauro@protonmail.com>", "Ivan Schuetz <ivanhp978@gmail.com>",]
description = "Application Binary Interface (ABI) to invoke smart contract methods with a standarized interface."
edition = "2024"
keywords = ["Algorand", "sdk"]
license = "MIT"
name = "algonaut_abi"
repository = "https://github.com/manuelmauro/algonaut"
version = "0.4.2"

[dependencies]
algonaut_core = {path = "../algonaut_core", version = "0.4.2"}
serde = {version = "1.0", features = ["derive"]}
regex = "1.12.3"
lazy_static = "1.5.0"
sha2 = "0.11.0"
derive_more = { version = "2.1.1", features = ["display", "from"] }
thiserror = "2.0.18"
num-bigint = "0.4.6"

[dev-dependencies]
serde_json = "1.0.149"
rand = "0.8.5"
num-bigint = { version = "0.4.6", features = ["rand"] }
