# openapi-generator config for the algonaut_indexer client.
# Consumed by `make generate-clients`; see docs/adr/openapi-client-regeneration.md.
#
# `inputSpec` / `outputDir` are supplied on the CLI by the Makefile so this
# file stays free of container paths.
generatorName: rust
additionalProperties:
  packageName: algonaut_indexer
  packageVersion: 0.6.0
  library: reqwest
# Algorand types nearly every integer as a 64-bit unsigned value. The spec
# only carries an explicit `format` on a minority of them, so these mappings
# fix the formatted cases; the format-less integers still need the model
# template (Phase 2 — see the ADR).
typeMappings:
  int32: u64
  int64: u64
  integer: u64
  long: u64
# D5 of ADR relocate-generated-models: rename the synthesized inline response
# envelopes to intentional names so no `<op>200Response`/`<op>400Response` name
# leaks into the public API. Keys are the generator's auto-assigned inline
# schema names (`<operationId>_<status>_response`); the exact keys are confirmed
# by the `make generate-clients` regen diff.
inlineSchemaNameMappings:
  lookupAccountAppLocalStates_200_response: AccountApplicationLocalStatesResponse
  lookupAccountAssets_200_response: AccountAssetsResponse
  lookupAccountByID_200_response: AccountResponse
  lookupAccountCreatedApplications_200_response: AccountCreatedApplicationsResponse
  lookupAccountCreatedAssets_200_response: AccountCreatedAssetsResponse
  lookupAccountTransactions_200_response: AccountTransactionsResponse
  lookupApplicationByID_200_response: ApplicationResponse
  lookupApplicationLogsByID_200_response: ApplicationLogsResponse
  lookupAssetBalances_200_response: AssetBalancesResponse
  lookupAssetByID_200_response: AssetResponse
  lookupTransaction_200_response: TransactionResponse
  searchForAccounts_200_response: AccountsResponse
  searchForAccounts_400_response: ErrorResponse
  searchForApplicationBoxes_200_response: ApplicationBoxesResponse
  searchForBlockHeaders_200_response: BlockHeadersResponse
