[package]
authors = [
    "Manuel Mauro <manuel.mauro@protonmail.com>",
    "Ivan Schuetz <ivanhp978@gmail.com>",
]
description = "API clients for the Algorand blockchain."
edition = "2018"
keywords = ["Algorand", "sdk"]
license = "MIT"
name = "algonaut_kmd"
repository = "https://github.com/manuelmauro/algonaut"
version = "0.4.2"

[dependencies]
algonaut_model = { path = "../algonaut_model", version = "0.4.2" }
algonaut_core = { path = "../algonaut_core", version = "0.4.2" }
algonaut_crypto = { path = "../algonaut_crypto", version = "0.4.2" }
algonaut_encoding = { path = "../algonaut_encoding", version = "0.4.2" }
data-encoding = "2.11.0"
derive_more = { version = "2.1.1", features = ["display"] }
reqwest = { version = "0.13", features = ["json"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
url = "2.5.8"
async-trait = "0.1.89"
rmp-serde = "1.3.1"

[dev-dependencies]
dotenv = "0.15.0"
rand = "0.8.5"
getrandom = { version = "0.2", features = ["js"] }
tokio = { version = "1.52.3", features = ["macros"] }

[features]
default = ["native"]
rustls = ["reqwest/rustls"]
native = ["reqwest/native-tls"]
