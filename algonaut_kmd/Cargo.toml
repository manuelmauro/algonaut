[package]
authors = [
    "Manuel Mauro <manuel.mauro@protonmail.com>",
    "Ivan Schuetz <ivanhp978@gmail.com>",
]
description = "API clients for the Algorand blockchain."
edition = "2024"
keywords = ["Algorand", "sdk"]
license = "MIT OR Apache-2.0"
name = "algonaut_kmd"
repository = "https://github.com/manuelmauro/algonaut"
version = "0.8.0"

[dependencies]
algonaut_core = { workspace = true }
algonaut_crypto = { workspace = true }
algonaut_encoding = { workspace = true }
algonaut_model = { workspace = true }
async-trait = { workspace = true }
data-encoding = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json"] }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
dotenv = { workspace = true }
getrandom = { workspace = true, features = ["js"] }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native = ["reqwest/native-tls"]
