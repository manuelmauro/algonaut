[package]
authors = [
  "Manuel Mauro <manuel.mauro@protonmail.com>",
  "Ivan Schuetz <ivanhp978@gmail.com>",
]
description = "A Rusty sdk for the Algorand blockchain."
edition = "2024"
keywords = ["Algorand", "sdk"]
license = "MIT OR Apache-2.0"
name = "algonaut"
repository = "https://github.com/manuelmauro/algonaut"
version = "0.9.0"

[workspace]
members = [
  "algonaut_algod",
  "algonaut_model",
  "algonaut_core",
  "algonaut_crypto",
  "algonaut_encoding",
  "algonaut_indexer",
  "algonaut_kmd",
  "algonaut_transaction",
  "algonaut_abi",
  "algonaut_abi_model",
  "algonaut_abi_sig",
  "algonaut_abi_macros",
]

[workspace.dependencies]
algonaut_abi = { path = "algonaut_abi", version = "0.9.0" }
algonaut_abi_model = { path = "algonaut_abi_model", version = "0.9.0" }
algonaut_abi_sig = { path = "algonaut_abi_sig", version = "0.9.0" }
algonaut_abi_macros = { path = "algonaut_abi_macros", version = "0.9.0" }
algonaut_algod = { path = "algonaut_algod", version = "0.9.0", default-features = false }
algonaut_core = { path = "algonaut_core", version = "0.9.0" }
algonaut_crypto = { path = "algonaut_crypto", version = "0.9.0" }
algonaut_encoding = { path = "algonaut_encoding", version = "0.9.0" }
algonaut_indexer = { path = "algonaut_indexer", version = "0.9.0", default-features = false }
algonaut_kmd = { path = "algonaut_kmd", version = "0.9.0", default-features = false }
algonaut_model = { path = "algonaut_model", version = "0.9.0" }
algonaut_transaction = { path = "algonaut_transaction", version = "0.9.0" }

async-trait = "0.1.89"
base64 = "0.22"
cucumber = "0.23.0"
data-encoding = "2.11.0"
derive_more = "2.1.1"
dotenv = "0.15.0"
env_logger = "0.11.10"
futures-timer = "3.0.3"
getrandom = "0.2"
gloo-timers = "0.4.0"
indexmap = "2.14.0"
instant = "0.1"
# Offline JSON Schema validation (default features pull reqwest/rustls for
# remote $ref resolution, which the self-contained ARC-56 schema never needs).
jsonschema = { version = "0.50", default-features = false }
lazy_static = "1.5.0"
log = "0.4.29"
num-bigint = "0.4.6"
num-traits = "0.2.19"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
ed25519-dalek = "2.2.0"
rand = "0.8.5"
regex = "1.12.3"
# default-features = false so each client crate picks exactly one TLS backend
# via its own native/rustls feature (no always-on native-tls). See ADR D4.
reqwest = { version = "0.13.3", default-features = false }
rmp-serde = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
serde_derive = "1.0"
serde_json = "1.0.149"
serde_with = "3.20.0"
sha2 = "0.11.0"
static_assertions = "1.1.0"
thiserror = "2.0.18"
tokio = "1.52.3"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23", features = ["serde"] }
wiremock = "0.6.5"

[dependencies]
algonaut_abi = { workspace = true }
algonaut_core = { workspace = true }
algonaut_crypto = { workspace = true }
algonaut_encoding = { workspace = true }
algonaut_model = { workspace = true }
algonaut_transaction = { workspace = true }

# Generated network clients — gated behind their respective features.
algonaut_algod = { workspace = true, optional = true }
algonaut_indexer = { workspace = true, optional = true }
algonaut_kmd = { workspace = true, optional = true }

data-encoding = { workspace = true }
env_logger = { workspace = true }
futures-timer = { workspace = true }
instant = { workspace = true, features = ["now"] }
log = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
# Only the algod/indexer wrappers build a reqwest client; pulled by those features.
reqwest = { workspace = true, optional = true }
rmp-serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true, features = ["futures"] }
instant = { workspace = true, features = ["now", "wasm-bindgen"] }

[dev-dependencies]
async-trait = { workspace = true }
cucumber = { workspace = true }
dotenv = { workspace = true }
getrandom = { workspace = true, features = ["js"] }
rand = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

[features]
# rustls is the default TLS backend: pure-Rust, no system OpenSSL.
default = ["algod", "indexer", "kmd", "rustls"]

# High-level network clients. Each pulls its generated client crate and
# unlocks the matching hand-written module(s). `algod` also gates the
# atomic / simulate / dryrun modules, which build on algod's models.
algod = ["dep:algonaut_algod", "dep:reqwest"]
indexer = ["dep:algonaut_indexer", "dep:reqwest"]
kmd = ["dep:algonaut_kmd"]

# TLS backend, forwarded to every enabled client. The weak `?` deps mean an
# unselected client is never pulled in just to set its TLS feature.
native = ["algonaut_algod?/native", "algonaut_indexer?/native", "algonaut_kmd?/native"]
rustls = ["algonaut_algod?/rustls", "algonaut_indexer?/rustls", "algonaut_kmd?/rustls"]

# Offline integration tests (the `contract!`-generated clients and logic sigs),
# grouped as modules under one binary. `algod` gates the ARC-56 module's typed
# `deploy`/state accessors; default features include it, so it runs normally.
[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["algod"]

[[test]]
name = "cucumber"
path = "tests/cucumber/main.rs"
# Allows Cucumber to print output instead of libtest
harness = false
test = false
# The cucumber acceptance suite drives the live algod/indexer/kmd clients.
required-features = ["algod", "indexer", "kmd"]

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
# The ARC-56 end-to-end suite deploys to a live algod and self-funds via kmd, so
# it is excluded from the default `cargo test` (run it with `make test-e2e`,
# compile-check it with `make check-e2e`).
test = false
required-features = ["algod", "kmd"]

