[package]
authors = [
  "Manuel Mauro <manuel.mauro@protonmail.com>",
  "Ivan Schuetz <ivanhp978@gmail.com>",
]
description = "A Rusty sdk for the Algorand blockchain."
edition = "2024"
keywords = ["Algorand", "sdk"]
license = "MIT OR Apache-2.0"
name = "algonaut"
repository = "https://github.com/manuelmauro/algonaut"
version = "0.6.0"

[workspace]
members = [
  "algonaut_algod",
  "algonaut_model",
  "algonaut_core",
  "algonaut_crypto",
  "algonaut_encoding",
  "algonaut_indexer",
  "algonaut_kmd",
  "algonaut_transaction",
  "algonaut_abi",
]

[workspace.dependencies]
algonaut_abi = { path = "algonaut_abi", version = "0.6.0" }
algonaut_algod = { path = "algonaut_algod", version = "0.6.0" }
algonaut_core = { path = "algonaut_core", version = "0.6.0" }
algonaut_crypto = { path = "algonaut_crypto", version = "0.6.0" }
algonaut_encoding = { path = "algonaut_encoding", version = "0.6.0" }
algonaut_indexer = { path = "algonaut_indexer", version = "0.6.0" }
algonaut_kmd = { path = "algonaut_kmd", version = "0.6.0", default-features = false }
algonaut_model = { path = "algonaut_model", version = "0.6.0" }
algonaut_transaction = { path = "algonaut_transaction", version = "0.6.0" }

async-trait = "0.1.89"
cucumber = "0.23.0"
data-encoding = "2.11.0"
derive_more = "2.1.1"
dotenv = "0.15.0"
env_logger = "0.11.10"
futures-timer = "3.0.3"
getrandom = "0.2"
gloo-timers = "0.4.0"
indexmap = "2.14.0"
instant = "0.1"
lazy_static = "1.5.0"
log = "0.4.29"
num-bigint = "0.4.6"
num-traits = "0.2.19"
ed25519-dalek = "2.2.0"
rand = "0.8.5"
regex = "1.12.3"
reqwest = "0.13.3"
rmp-serde = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
serde_derive = "1.0"
serde_json = "1.0.149"
serde_with = "3.20.0"
sha2 = "0.11.0"
static_assertions = "1.1.0"
thiserror = "2.0.18"
tokio = "1.52.3"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23", features = ["serde"] }
wiremock = "0.6.5"

[dependencies]
algonaut_abi = { workspace = true }
algonaut_algod = { workspace = true }
algonaut_core = { workspace = true }
algonaut_crypto = { workspace = true }
algonaut_encoding = { workspace = true }
algonaut_indexer = { workspace = true }
algonaut_kmd = { workspace = true }
algonaut_model = { workspace = true }
algonaut_transaction = { workspace = true }

data-encoding = { workspace = true }
env_logger = { workspace = true }
futures-timer = { workspace = true }
instant = { workspace = true, features = ["now"] }
log = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true, features = ["futures"] }
instant = { workspace = true, features = ["now", "wasm-bindgen"] }

[dev-dependencies]
async-trait = { workspace = true }
cucumber = { workspace = true }
dotenv = { workspace = true }
getrandom = { workspace = true, features = ["js"] }
rand = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

[features]
default = ["native"]
native = ["algonaut_kmd/native"]
rustls = ["algonaut_kmd/rustls"]

[[test]]
name = "features_runner"
# Allows Cucumber to print output instead of libtest
harness = false
test = false
